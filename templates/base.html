<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Wander{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <header class="navbar">
    <div class="navbar-inner">
      <a class="brand" href="/">Wander</a>

      <nav class="nav-links">
        {% if session.user_id %}
          <span class="nav-greeting">Hi, {{ session.name }}</span>
          <a class="nav-btn" href="/profile">My boards</a>
          <a class="nav-btn" href="/logout">Log out</a>
        {% else %}
          <a class="nav-btn" href="/login">Log in</a>
          <a class="nav-btn" href="/signup">Sign up</a>
        {% endif %}
      </nav>
    </div>
  </header>

  <main class="container">
    {% with messages = get_flashed_messages() %}
      {% for message in messages %}
        <p class="flash">{{ message }}</p>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

</body>
</html>
